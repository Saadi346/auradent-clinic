  <rect width="800" height="500" fill="url(#bgBond)"/>
  <rect x="25" y="25" width="750" height="450" rx="16" fill="none" stroke="rgba(239, 68, 68, 0.35)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="50" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ef4444" letter-spacing="2">TRAUMATIC INCISAL FRACTURE • CASE #105</text>
  <text x="750" y="65" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">TOOTH #8 CLASS IV ENAMEL FRACTURE</text>

  <!-- Gums -->
  <path d="M 120 220 C 180 160, 240 180, 280 200 C 325 160, 365 165, 395 190 C 425 165, 465 160, 510 200 C 550 180, 610 160, 680 220 L 680 180 C 600 120, 200 120, 120 180 Z" fill="#e11d48"/>

