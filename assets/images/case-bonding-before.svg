    <!-- Left Lateral -->
    <path d="M 415 205 Q 445 205, 455 320 Q 430 322, 420 305 Z" fill="url(#bondToothPre)" stroke="#a16207"/>
  </g>

  <!-- Lower Lip -->
  <path d="M 95 310 C 250 405, 550 405, 705 310 C 650 445, 150 445, 95 310 Z" fill="#9f1239" opacity="0.95"/>

  <g transform="translate(50, 420)">
    <rect width="260" height="34" rx="8" fill="rgba(8,12,20,0.85)" stroke="#ef4444" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#ef4444"/>
    <text x="32" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#fca5a5">PRE-OP: ACCIDENTAL SPORTS IMPACT</text>
