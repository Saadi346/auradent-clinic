<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#070b14"/>
    </radialGradient>
    <linearGradient id="lipGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a3d4e"/>
      <stop offset="100%" stop-color="#6b2132"/>
    </linearGradient>
    <linearGradient id="enamelPre" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="40%" stop-color="#edd59c"/>
      <stop offset="100%" stop-color="#c9a767"/>
    </linearGradient>
    <linearGradient id="gumPre" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cc6677"/>
      <stop offset="100%" stop-color="#aa4455"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bgGlow)"/>

  <!-- Clinical Retractor Frame Outline -->
  <rect x="25" y="25" width="750" height="450" rx="16" fill="none" stroke="rgba(197, 160, 89, 0.25)" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Clinical Metadata Header -->
  <text x="50" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#c5a059" letter-spacing="2">PRE-OPERATIVE CLINICAL BASELINE • CASE #101</text>
  <text x="750" y="65" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">SHADE: VITA A3.5 (CHIPPED INCISAL)</text>

  <!-- Upper Gums -->
  <path d="M 120 230 C 180 160, 240 180, 280 200 C 330 165, 370 170, 400 195 C 430 170, 470 165, 520 200 C 560 180, 620 160, 680 230 L 680 180 C 600 130, 200 130, 120 180 Z" fill="url(#gumPre)"/>

  <!-- Teeth Group (Pre-Op: Stained, Uneven, Chipped) -->
  <g id="preOpTeeth">
    <!-- Right Canine (13) -->
    <path d="M 170 215 C 190 220, 205 260, 200 300 C 185 305, 170 280, 165 240 Z" fill="url(#enamelPre)" stroke="#997a3d" stroke-width="1"/>
    <!-- Right Lateral (12) - Minor rotation -->
    <path d="M 210 210 C 235 210, 255 240, 250 310 C 230 315, 215 310, 205 300 Z" fill="url(#enamelPre)" stroke="#997a3d" stroke-width="1"/>
    <!-- Right Central (11) - Chipped corner -->
    <path d="M 260 200 C 320 195, 335 240, 330 330 L 295 330 L 290 320 L 265 315 Z" fill="url(#enamelPre)" stroke="#997a3d" stroke-width="1.2"/>
    <!-- Left Central (21) - Tetracycline banding -->
    <path d="M 340 195 C 390 195, 410 235, 410 335 C 375 335, 345 335, 335 330 Z" fill="url(#enamelPre)" stroke="#997a3d" stroke-width="1.2"/>
    <!-- Left Lateral (22) - Shorter -->
    <path d="M 415 205 C 450 210, 465 245, 460 305 C 440 310, 420 310, 412 300 Z" fill="url(#enamelPre)" stroke="#997a3d" stroke-width="1"/>
    <!-- Left Canine (23) -->
    <path d="M 470 215 C 500 220, 515 260, 505 300 C 490 305, 475 285, 468 240 Z" fill="url(#enamelPre)" stroke="#997a3d" stroke-width="1"/>

    <!-- Incisal Fracture Highlight on 11 -->
    <path d="M 295 330 L 290 320 L 265 315" stroke="#7a5818" stroke-width="2.5" fill="none"/>
    <!-- Discoloration Bands -->
    <line x1="265" y1="260" x2="330" y2="265" stroke="#b08b48" stroke-width="4" stroke-opacity="0.4"/>
    <line x1="340" y1="265" x2="408" y2="268" stroke="#b08b48" stroke-width="5" stroke-opacity="0.45"/>
  </g>

  <!-- Lower Lip Shadow -->
  <path d="M 100 320 C 250 410, 550 410, 700 320 C 650 450, 150 450, 100 320 Z" fill="url(#lipGradient)" opacity="0.95"/>

  <!-- Measurement Overlay Annotation -->
  <g transform="translate(50, 420)">
    <rect width="210" height="34" rx="8" fill="rgba(8,12,20,0.85)" stroke="#e11d48" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#e11d48"/>
    <text x="32" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#fecdd3">PRE-OP ENAMEL WEAR &amp; CHIP</text>
  </g>
</svg>
