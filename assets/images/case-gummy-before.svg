<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGum" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#182033"/>
      <stop offset="100%" stop-color="#0a0d18"/>
    </radialGradient>
    <linearGradient id="shortToothPre" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="excessGum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGum)"/>
  <rect x="25" y="25" width="750" height="450" rx="16" fill="none" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="50" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#f43f5e" letter-spacing="2">EXCESSIVE GINGIVAL DISPLAY • CASE #106</text>
  <text x="750" y="65" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">4.5mm GUMMY SMILE &amp; SHORT CROWNS</text>

  <!-- Deep Low Gums Overcovering 40% of Tooth Crown -->
  <path d="M 100 280 C 180 230, 240 240, 275 255 C 315 235, 360 235, 395 250 C 435 235, 475 235, 515 255 C 550 240, 610 230, 690 280 L 690 150 C 600 110, 200 110, 100 150 Z" fill="url(#excessGum)"/>

  <!-- Short Stumpy Visible Crowns -->
  <g>
    <!-- Right Lateral -->
    <path d="M 210 260 Q 235 260, 245 320 Q 220 322, 210 305 Z" fill="url(#shortToothPre)" stroke="#a16207"/>
    <!-- Right Central (11) - Short Stubby -->
    <path d="M 260 252 Q 320 250, 330 335 Q 295 338, 255 328 Z" fill="url(#shortToothPre)" stroke="#a16207" stroke-width="1.2"/>
    <!-- Left Central (21) - Short Stubby -->
    <path d="M 334 250 Q 395 252, 405 335 Q 370 338, 334 335 Z" fill="url(#shortToothPre)" stroke="#a16207" stroke-width="1.2"/>
    <!-- Left Lateral -->
    <path d="M 415 260 Q 440 260, 450 320 Q 425 322, 415 305 Z" fill="url(#shortToothPre)" stroke="#a16207"/>

    <!-- Excess Gum Measurement Line -->
    <line x1="332" y1="180" x2="332" y2="250" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="3 3"/>
    <text x="345" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#f43f5e">4.5mm Overgrowth</text>
  </g>

  <!-- Lower Lip -->
  <path d="M 95 310 C 250 405, 550 405, 705 310 C 650 445, 150 445, 95 310 Z" fill="#9f1239" opacity="0.95"/>

  <g transform="translate(50, 420)">
    <rect width="250" height="34" rx="8" fill="rgba(8,12,20,0.85)" stroke="#f43f5e" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#f43f5e"/>
    <text x="32" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#fecdd3">PRE-OP: EXCESS GINGIVAL TISSUE</text>
  </g>
</svg>
