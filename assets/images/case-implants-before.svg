<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgImp" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#182033"/>
      <stop offset="100%" stop-color="#0a0d18"/>
    </radialGradient>
    <linearGradient id="boneResorb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="decayEnamel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgImp)"/>
  <rect x="25" y="25" width="750" height="450" rx="16" fill="none" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="50" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ef4444" letter-spacing="2">TERMINAL DENTITION • CASE #102</text>
  <text x="750" y="65" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">BONE LOSS &amp; FAILING DENTITION</text>

  <!-- Severely Receded Upper Ridge -->
  <path d="M 120 220 Q 250 150, 400 150 Q 550 150, 680 220 L 680 180 Q 550 110, 400 110 Q 250 110, 120 180 Z" fill="url(#boneResorb)"/>

  <!-- Broken, Missing, Stained Residual Teeth with Gaps -->
  <g>
    <!-- Right Molar Stub -->
    <path d="M 170 210 Q 185 210, 190 250 Q 170 260, 160 230 Z" fill="url(#decayEnamel)" stroke="#451a03"/>
    <!-- Missing Premolars Gap with X Indicator -->
    <text x="230" y="240" font-family="sans-serif" font-size="20" fill="#ef4444" text-anchor="middle">✕</text>
    <text x="230" y="260" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#f87171" text-anchor="middle">MISSING</text>
    <!-- Fractured Central -->
    <path d="M 330 185 Q 360 185, 360 270 Q 330 250, 325 210 Z" fill="url(#decayEnamel)" stroke="#451a03"/>
    <!-- Missing Central/Lateral Gap -->
    <text x="420" y="240" font-family="sans-serif" font-size="20" fill="#ef4444" text-anchor="middle">✕</text>
    <text x="420" y="260" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#f87171" text-anchor="middle">MISSING</text>
    <!-- Severely Tilted Left Premolar -->
    <path d="M 520 200 Q 545 210, 540 265 Q 515 270, 510 225 Z" fill="url(#decayEnamel)" stroke="#451a03"/>
  </g>

  <!-- Oral Cavity Shadow -->
  <path d="M 100 300 C 250 380, 550 380, 700 300 C 650 430, 150 430, 100 300 Z" fill="#4a044e" opacity="0.8"/>

  <g transform="translate(50, 420)">
    <rect width="250" height="34" rx="8" fill="rgba(8,12,20,0.85)" stroke="#ef4444" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#ef4444"/>
    <text x="32" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#fca5a5">PRE-OP: EDENTULOUS &amp; UNSTABLE</text>
  </g>
</svg>
